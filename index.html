<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Mother's Day 🌸</title>
  <link type="image/png" sizes="16x16" rel="icon" href="pri/favicon.png">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f9d4d4 0%, #ffd9d9 45%, #fff1f1 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #3d2728;
    }

    .login-card {
      width: min(400px, 90%);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      background: #ffffffee;
      text-align: center;
    }

    .login-card h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      letter-spacing: 0.03em;
    }

    .login-card p {
      margin: 0 0 1.5rem;
      color: #6b4d54;
    }

    .login-card label {
      display: block;
      text-align: left;
      margin: 0.75rem 0 0.35rem;
      font-size: 0.95rem;
    }

    .login-card input {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1px solid #e6c6c6;
      border-radius: 12px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .login-card button {
      width: 100%;
      margin-top: 1.4rem;
      padding: 0.95rem 1rem;
      border: none;
      border-radius: 12px;
      background: #e07585;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .login-card button:hover {
      background: #c95d6d;
    }

    .error {
      margin-top: 1rem;
      color: #9d2231;
      font-size: 0.95rem;
    }

    .note {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: #8a646d;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <h1>Welcome Back</h1>
    <p>Please sign in to continue to the Mother's Day surprise.</p>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div id="errorMessage" class="error" role="alert" aria-live="polite"></div>
    </form>
  </div>
  <script src="tia.js"></script>
  <script>
    const tokenKey = 'logintoken';
    const sessionDurationMs = 10 * 60 * 1000; // 10 minutes

    let validUser = '';
    let validPass = '';
    let credentialsLoaded = false;

    function createRandomToken(length = 32) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({ length }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    }

    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');

    function loadCredentials() {
      if (!window.credentials) {
        errorMessage.textContent = 'Unable to load login credentials.';
        return;
      }

      validUser = window.credentials.username ? atob(window.credentials.username) : '';
      validPass = window.credentials.password ? atob(window.credentials.password) : '';
      credentialsLoaded = Boolean(validUser && validPass);

      if (!credentialsLoaded) {
        errorMessage.textContent = 'Login configuration is invalid.';
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      if (!credentialsLoaded) {
        errorMessage.textContent = 'Login is not ready yet. Please wait and try again.';
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (username === validUser && password === validPass) {
        const authPayload = {
          token: createRandomToken(32),
          expiresAt: Date.now() + sessionDurationMs
        };

        sessionStorage.setItem(tokenKey, JSON.stringify(authPayload));
        window.location.href = 'home.html';
        return;
      }

      errorMessage.textContent = 'Invalid username or password. Please try again.';
    });

    loadCredentials();
  </script>
</body>

</html>
